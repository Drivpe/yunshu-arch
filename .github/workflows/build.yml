name: Build and release

on:
  push:
    branches: [main]
    paths: ['PKGBUILD']
  schedule:
    # 每天 03:17 UTC 检查上游是否有新版
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: '强制指定版本号（留空则自动探测）'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          pacman -Syu --noconfirm --needed base-devel git libarchive jq github-cli
          git config --global --add safe.directory '*'
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 确定版本
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLIC_TOKEN: ${{ vars.YUNSHU_PUBLIC_TOKEN || 'LtupUtmVFiEJ' }}
          FORCED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${FORCED:-}" ]; then
            V="$FORCED"; echo "手动指定: $V"
          else
            V=$(curl -sSf --max-time 30 \
              "https://brizoo.eagleyun.com/anonApi/v1/spa/download/app/versions?token=${PUBLIC_TOKEN}&lang=zh-cn" \
              | jq -r '.data.electron_downloads[]
                       | select(.platform=="linux" and .os_release=="ubuntu" and .arch=="x86_64")
                       | .version' | sort -V | tail -1)
          fi
          [ -n "$V" ] && [ "$V" != "null" ] || { echo "::error::无法确定版本"; exit 1; }
          CUR=$(grep -oP '^pkgver=\K.*' PKGBUILD)
          echo "version=$V"   >> "$GITHUB_OUTPUT"
          echo "current=$CUR" >> "$GITHUB_OUTPUT"

          if [ "$CUR" = "$V" ]; then
            # 版本没变，但若 Release 还没有该 tag，仍需构建并发版
            if gh release view "v${V}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "版本未变且 Release 已存在，跳过"
              echo "changed=false" >> "$GITHUB_OUTPUT"
            else
              echo "版本未变但 Release 不存在，执行首次发版"
              echo "changed=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "发现新版：$CUR -> $V"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 同步 PKGBUILD 到新版本
        if: steps.ver.outputs.changed == 'true'
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          URL="https://pkg-cdn-hz0.sase.eagleyun.com/app/linux/${V}/ubuntu/x86_64/eaglecloud_yunshu_${V}_amd64.deb"
          CODE=$(curl -sSL -o /dev/null -w '%{http_code}' --max-time 60 -I "$URL")
          [ "$CODE" = "200" ] || { echo "::error::CDN 无该版本 ($CODE)"; exit 1; }

          curl -sSL --max-time 600 "$URL" -o /tmp/pkg.deb
          SHA=$(sha256sum /tmp/pkg.deb | awk '{print $1}')
          echo "sha256=$SHA"

          sed -i "s/^pkgver=.*/pkgver=${V}/"     PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/"        PKGBUILD
          sed -i "s/^sha256sums=.*/sha256sums=('${SHA}')/" PKGBUILD
          # 把 deb 放到 srcdir，免得 makepkg 再下一次
          cp /tmp/pkg.deb "eaglecloud_yunshu_${V}_amd64.deb"

      - name: 构建
        run: |
          set -euo pipefail
          useradd -m builder || true
          chown -R builder:builder .
          su builder -c 'makepkg -f --nodeps --noconfirm'
          ls -lh ./*.pkg.tar.zst

      - name: 校验包内容
        run: |
          set -euo pipefail
          PKG=$(ls -1 ./*.pkg.tar.zst | head -1)
          echo "包: $PKG"

          fail=0
          chk() { if [ "$2" = "0" ]; then echo "PASS $1"; else echo "FAIL $1 (实际 $2)"; fail=1; fi; }

          chk "plugin 已移除"   "$(bsdtar -tf "$PKG" | grep -c 'files/plugin')"
          chk "config.db 未打包" "$(bsdtar -tf "$PKG" | grep -c 'config.db')"
          chk "screenshot 已移除" "$(bsdtar -tf "$PKG" | grep -ci screenshot)"

          # 必须有可执行位，否则 systemd 报 203/EXEC
          bsdtar -tvf "$PKG" | grep 'bin/yunshu-daemon' | grep -q '^-rwx' && echo "PASS daemon 可执行" || { echo "FAIL daemon 无可执行位"; fail=1; }
          bsdtar -tvf "$PKG" | grep 'bin/yunshu-updater' | grep -q '^-rwx' && echo "PASS updater 可执行" || { echo "FAIL updater 无可执行位"; fail=1; }

          # 空目录必须保留，否则 daemon 起来就退
          for d in socket tmp logs; do
            bsdtar -tf "$PKG" | grep -q "files/$d/$" && echo "PASS files/$d 存在" || { echo "FAIL files/$d 缺失"; fail=1; }
          done

          # sdk 原生模块必须在，否则主进程起不来
          [ "$(bsdtar -tf "$PKG" | grep -c 'node_modules/sdk/')" -ge 5 ] && echo "PASS sdk 模块完整" || { echo "FAIL sdk 模块缺失"; fail=1; }

          exit $fail

      - name: 生成 pacman 数据库
        if: steps.ver.outputs.changed == 'true'
        run: |
          set -euo pipefail
          PKG=$(ls -1 ./*.pkg.tar.zst | head -1)
          mkdir -p docs/x86_64
          cp "$PKG" docs/x86_64/
          cd docs/x86_64
          repo-add yunshu.db.tar.gz "$PKG"
          # repo-add 会把 yunshu.db 做成指向 .tar.gz 的软链，
          # 但 GitHub Release 不接受软链附件，这里换成实体副本。
          # pacman 优先请求不带后缀的 yunshu.db，两者都要有。
          cp --remove-destination yunshu.db.tar.gz yunshu.db
          cp --remove-destination yunshu.files.tar.gz yunshu.files
          ls -lh ./yunshu.db* ./yunshu.files*
          rm -f "$PKG"   # 包走 Release，不进 git

      - name: 提交数据库到仓库
        if: steps.ver.outputs.changed == 'true'
        run: |
          set -euo pipefail
          echo "== 诊断 =="
          echo "pwd=$(pwd)"
          echo "GITHUB_WORKSPACE=${GITHUB_WORKSPACE}"
          ls -d "${GITHUB_WORKSPACE}/.git" 2>&1 || true
          git --version
          cd "${GITHUB_WORKSPACE}"
          echo "cd 后 pwd=$(pwd)"
          git rev-parse --git-dir 2>&1 || echo "不是 git 仓库"

          V="${{ steps.ver.outputs.version }}"
          git add PKGBUILD docs/x86_64/yunshu.db docs/x86_64/yunshu.db.tar.gz \
                  docs/x86_64/yunshu.files docs/x86_64/yunshu.files.tar.gz 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "无变更需提交"
            exit 0
          fi

          git commit -m "upgpkg: yunshu ${V}-1 (auto)"
          # GitHub Actions 的 checkout 是 detached HEAD，需显式推到 main
          git push origin HEAD:main

      - name: 发布 Release（上传包与数据库）
        if: steps.ver.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ steps.ver.outputs.version }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          PKG=$(ls -1 ./*.pkg.tar.zst | head -1)
          TAG="v${V}"
          PAGES="https://${OWNER}.github.io/${REPO#*/}/"

          NOTES=$(printf '%s\n' \
            "云枢 ${V} 的 Arch Linux 包。" \
            "" \
            "安装方式：${PAGES}" \
            "" \
            "**本包不含 DLP、截图审计与厂商自更新器。**")

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，改用上传附件"
            gh release upload "$TAG" --repo "$REPO" --clobber \
              "$PKG" \
              docs/x86_64/yunshu.db \
              docs/x86_64/yunshu.db.tar.gz \
              docs/x86_64/yunshu.files \
              docs/x86_64/yunshu.files.tar.gz
          else
            gh release create "$TAG" --repo "$REPO" \
              --title "yunshu ${V}-1" \
              --notes "$NOTES" \
              "$PKG" \
              docs/x86_64/yunshu.db \
              docs/x86_64/yunshu.db.tar.gz \
              docs/x86_64/yunshu.files \
              docs/x86_64/yunshu.files.tar.gz
          fi

      - name: 无新版时输出
        if: steps.ver.outputs.changed == 'false'
        run: echo "已是最新 ${{ steps.ver.outputs.version }}，无需发布"
