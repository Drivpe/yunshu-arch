name: Build and release

on:
  push:
    branches: [main]
    paths: ['PKGBUILD']
  schedule:
    # 每天 03:17 UTC 检查上游是否有新版
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: '强制指定版本号（留空则自动探测）'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ── Job 1：在 Arch 容器里构建 ───────────────────────────────
  # 只在容器里做「编译打包」这种必须有 Arch 环境的事。
  # 不做 git 操作：容器内的 /__w 挂载不含 .git，git 会报 not a repository。
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    outputs:
      version: ${{ steps.ver.outputs.version }}
      changed: ${{ steps.ver.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          pacman -Syu --noconfirm --needed base-devel git libarchive jq curl

      - name: 确定版本
        id: ver
        env:
          PUBLIC_TOKEN: ${{ vars.YUNSHU_PUBLIC_TOKEN || 'LtupUtmVFiEJ' }}
          FORCED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${FORCED:-}" ]; then
            V="$FORCED"; echo "手动指定: $V"
          else
            V=$(curl -sSf --max-time 30 \
              "https://brizoo.eagleyun.com/anonApi/v1/spa/download/app/versions?token=${PUBLIC_TOKEN}&lang=zh-cn" \
              | jq -r '.data.electron_downloads[]
                       | select(.platform=="linux" and .os_release=="ubuntu" and .arch=="x86_64")
                       | .version' | sort -V | tail -1)
          fi
          [ -n "$V" ] && [ "$V" != "null" ] || { echo "::error::无法确定版本"; exit 1; }
          CUR=$(grep -oP '^pkgver=\K.*' PKGBUILD)
          echo "version=$V"   >> "$GITHUB_OUTPUT"
          echo "current=$CUR" >> "$GITHUB_OUTPUT"
          if [ "$CUR" = "$V" ]; then
            echo "changed=true"  >> "$GITHUB_OUTPUT"   # 仍需构建产物，交给 job2 判断是否发版
          else
            echo "changed=true"  >> "$GITHUB_OUTPUT"
          fi
          echo "当前 $CUR / 上游 $V"

      - name: 同步 PKGBUILD 到上游版本
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          DEB="eaglecloud_yunshu_${V}_amd64.deb"
          URL="https://pkg-cdn-hz0.sase.eagleyun.com/app/linux/${V}/ubuntu/x86_64/${DEB}"

          CODE=$(curl -sSL -o /dev/null -w '%{http_code}' --max-time 60 -I "$URL")
          [ "$CODE" = "200" ] || { echo "::error::CDN 上无该版本 ($CODE)"; exit 1; }

          curl -sSL --max-time 900 "$URL" -o "$DEB"
          SHA=$(sha256sum "$DEB" | awk '{print $1}')
          echo "sha256=$SHA"

          sed -i "s/^pkgver=.*/pkgver=${V}/"     PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/"        PKGBUILD
          sed -i "s/^sha256sums=.*/sha256sums=('${SHA}')/" PKGBUILD
          echo "--- PKGBUILD 变更 ---"
          git --no-pager diff PKGBUILD 2>/dev/null || grep -E '^pkgver|^sha256' PKGBUILD

      - name: 构建
        run: |
          set -euo pipefail
          useradd -m builder || true
          chown -R builder:builder .
          su builder -c 'makepkg -f --nodeps --noconfirm'
          ls -lh ./*.pkg.tar.zst

      - name: 校验包内容
        run: |
          set -euo pipefail
          PKG=$(ls -1 ./*.pkg.tar.zst | head -1)
          echo "包: $PKG"
          fail=0

          [ "$(bsdtar -tf "$PKG" | grep -c 'files/plugin')" = "0" ] \
            && echo "PASS plugin 已移除" || { echo "FAIL plugin 残留"; fail=1; }
          [ "$(bsdtar -tf "$PKG" | grep -c 'config.db')" = "0" ] \
            && echo "PASS config.db 未打包" || { echo "FAIL 含 config.db"; fail=1; }

          bsdtar -tvf "$PKG" | grep 'bin/yunshu-daemon' | grep -q '^-rwx' \
            && echo "PASS daemon 可执行" || { echo "FAIL daemon 无执行位"; fail=1; }
          bsdtar -tvf "$PKG" | grep 'bin/yunshu-updater' | grep -q '^-rwx' \
            && echo "PASS updater 可执行" || { echo "FAIL updater 无执行位"; fail=1; }

          for d in socket tmp logs; do
            bsdtar -tf "$PKG" | grep -q "files/$d/$" \
              && echo "PASS files/$d" || { echo "FAIL files/$d 缺失"; fail=1; }
          done

          [ "$(bsdtar -tf "$PKG" | grep -c 'node_modules/sdk/')" -ge 5 ] \
            && echo "PASS sdk 模块完整" || { echo "FAIL sdk 缺失"; fail=1; }

          exit $fail

      - name: 生成 pacman 数据库
        run: |
          set -euo pipefail
          PKG=$(ls -1 ./*.pkg.tar.zst | head -1)
          mkdir -p out
          cp "$PKG" out/
          cd out
          repo-add yunshu.db.tar.gz "$PKG"
          # repo-add 生成的 yunshu.db 是软链，Release 不接受软链，换成实体副本
          cp --remove-destination yunshu.db.tar.gz   yunshu.db
          cp --remove-destination yunshu.files.tar.gz yunshu.files
          rm -f "$PKG"          # 包单独走 artifact
          ls -lh

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: pkg
          path: |
            ./*.pkg.tar.zst
            PKGBUILD
            out/yunshu.db
            out/yunshu.db.tar.gz
            out/yunshu.files
            out/yunshu.files.tar.gz
          retention-days: 7

  # ── Job 2：在宿主机提交与发版 ───────────────────────────────
  # git 与 gh 操作必须在宿主机做：容器内 /__w 挂载不含 .git。
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: pkg

      - name: 整理文件
        run: |
          set -euo pipefail
          ls -lh
          mkdir -p docs/x86_64
          mv yunshu.db yunshu.db.tar.gz yunshu.files yunshu.files.tar.gz docs/x86_64/
          ls -lh docs/x86_64/
          ls -1 ./*.pkg.tar.zst

      - name: 提交 PKGBUILD 与数据库
        run: |
          set -euo pipefail
          V="${{ needs.build.outputs.version }}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add PKGBUILD docs/x86_64/yunshu.db docs/x86_64/yunshu.db.tar.gz \
                  docs/x86_64/yunshu.files docs/x86_64/yunshu.files.tar.gz

          if git diff --cached --quiet; then
            echo "无变更需提交"
            exit 0
          fi
          git commit -m "upgpkg: yunshu ${V}-1 (auto)"
          git push

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ needs.build.outputs.version }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          PKG=$(ls -1 ./*.pkg.tar.zst | head -1)
          TAG="v${V}"
          PAGES="https://${OWNER}.github.io/${REPO#*/}/"

          NOTES=$(printf '%s\n' \
            "云枢 ${V} 的 Arch Linux 包。" \
            "" \
            "安装方式：${PAGES}" \
            "" \
            "**本包不含 DLP、截图审计与厂商自更新器。**")

          FILES=("$PKG"
                 docs/x86_64/yunshu.db
                 docs/x86_64/yunshu.db.tar.gz
                 docs/x86_64/yunshu.files
                 docs/x86_64/yunshu.files.tar.gz)

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，上传/覆盖附件"
            gh release upload "$TAG" --repo "$REPO" --clobber "${FILES[@]}"
          else
            gh release create "$TAG" --repo "$REPO" \
              --title "yunshu ${V}-1" --notes "$NOTES" "${FILES[@]}"
          fi
